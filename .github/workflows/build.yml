name: Build Pascal

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Free Pascal
        run: |
          sudo apt update
          sudo apt install -y fpc

      - name: Build
        run: |
          fpc pspkg.pas
